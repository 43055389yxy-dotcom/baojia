name: astraquote

services:
  astraquote:
    image: astraquote:production
    container_name: astraquote
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - /home/ec2-user/astraquote/config/backend.env
      - /home/ec2-user/astraquote/config/mcp.env
      - /home/ec2-user/astraquote/config/oauth.env
    environment:
      ASTRAQUOTE_LOCAL_MODE: "1"
      ASTRAQUOTE_PYTHON: python3
      ASTRAQUOTE_BACKEND_ROOT: /app/backend
      ASTRAQUOTE_LOCAL_BRIDGE: /app/backend/scripts/local_mcp_bridge.py
      ASTRAQUOTE_V2_STATE_DIR: /data/v2-quotes
      ASTRAQUOTE_ARTIFACT_DIR: /data/v2-quotes/artifacts
      ASTRAQUOTE_DELIVERY_MODE: local
      ASTRAQUOTE_DOWNLOAD_DIR: /data/downloads
      ASTRAQUOTE_PUBLIC_BASE_URL: https://baojia.tontianit.com
      ASTRAQUOTE_MCP_HOST: 0.0.0.0
      ASTRAQUOTE_MCP_PORT: "8200"
      ASTRAQUOTE_BACKEND_TIMEOUT_MS: "120000"
      ASTRAQUOTE_MCP_RESULT_MAX_BYTES: "131072"
      DB_PATH: /data/oauth/oauth.db
      MCP_PATH: /mcp
      PASSWORDLESS_AUTH: "true"
      OAUTH_PORT: "8001"
      UPSTREAM_MCP: http://127.0.0.1:8200/v2/mcp
      UPSTREAM_READY_URL: http://127.0.0.1:8200/readyz
    volumes:
      - /home/ec2-user/astraquote/data:/data
    networks:
      caddy-net:
        aliases:
          - astraquote-mcp
          - aws-pricing-mcp
          - aws-pricing-mcp-oauth
    deploy:
      resources:
        limits:
          memory: 2600M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy-net:
    external: true
